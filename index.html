<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Hero Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: #f0f9ff;
            overflow-x: hidden;
        }
        .math-card {
            box-shadow: 0 8px 0 #cbd5e1;
            transition: all 0.2s;
        }
        .math-card:active {
            box-shadow: 0 2px 0 #cbd5e1;
            transform: translateY(6px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }
        .animate-shake {
          animation: shake 0.2s ease-in-out 0s 2;
        }

        /* Result Screen Animations */
        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slide-up-fade {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up-fade {
            animation: slide-up-fade 0.5s ease-out forwards;
        }

        @keyframes count-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); color: #f59e0b; }
            100% { transform: scale(1); }
        }
        .animate-count-pop {
            animation: count-pop 0.4s ease-out;
        }

        @keyframes winner-glow {
            0%, 100% { text-shadow: 0 0 10px rgba(79, 70, 229, 0.4); }
            50% { text-shadow: 0 0 25px rgba(79, 70, 229, 0.8), 0 0 40px rgba(79, 70, 229, 0.4); }
        }
        .animate-winner-glow {
            animation: winner-glow 2s ease-in-out infinite;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
