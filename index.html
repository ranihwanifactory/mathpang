        }
        .math-card {
            box-shadow: 0 8px 0 #cbd5e1;
            transition: all 0.2s;
        }
        .math-card:active {
            box-shadow: 0 2px 0 #cbd5e1;
            transform: translateY(6px);
        }
        @keyframes float {

            50% { transform: translateY(-10px); }
        }

            animation: float 3s ease-in-out infinite;
        }
